name: Render YouTube Short Draft (Free)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for image search and title overlay"
        required: true
        type: string
      script_text:
        description: "Paste the reviewed English script. This creates a draft video only."
        required: true
        type: string
      voice:
        description: "English narration voice"
        required: true
        type: choice
        options:
          - en-US-AriaNeural
          - en-US-GuyNeural
          - en-US-JennyNeural
        default: en-US-AriaNeural

permissions:
  contents: read

jobs:
  render-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow requests edge-tts

      - name: Render video draft
        env:
          TOPIC: \${{ inputs.topic }}
          SCRIPT_TEXT: \${{ inputs.script_text }}
          VOICE: \${{ inputs.voice }}
        run: python src/web_short_renderer.py

      - name: Upload draft video package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-video-draft-\${{ github.run_number }}
          path: rendered-draft/
          if-no-files-found: error
          retention-days: 30
