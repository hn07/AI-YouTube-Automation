name: Web Control Center - YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (English recommended)"
        required: true
        type: string
      script_text:
        description: "Paste the reviewed English script. This creates a draft package only."
        required: true
        type: string
      voice:
        description: "Preferred narration voice (saved as metadata only)"
        required: true
        type: choice
        options:
          - en-US-AriaNeural
          - en-US-GuyNeural
          - en-US-JennyNeural
      create_fact_check_register:
        description: "Create an UNREVIEWED evidence checklist"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  create-review-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create script and evidence-review package
        env:
          TOPIC: ${{ inputs.topic }}
          SCRIPT_TEXT: ${{ inputs.script_text }}
          VOICE: ${{ inputs.voice }}
          CREATE_REGISTER: ${{ inputs.create_fact_check_register }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone

          topic = os.environ["TOPIC"].strip()
          script = os.environ["SCRIPT_TEXT"].strip()
          voice = os.environ["VOICE"].strip()
          if not topic or not script:
              raise SystemExit("Topic and script are required.")
          job_id = "web_" + os.environ["RUN_ID"]
          out = Path("web-output") / job_id
          out.mkdir(parents=True, exist_ok=False)
          (out / "script.txt").write_text(script + "\n", encoding="utf-8")
          metadata = {
              "schema_version": "web-1.0",
              "job_id": job_id,
              "topic": topic,
              "voice_preference": voice,
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": "GitHub Actions Web Control Center",
              "production_status": "DRAFT_ONLY",
              "human_approved": False,
              "upload_allowed": False,
              "publish_allowed": False,
              "note": "This workflow creates a review package only; it does not render, upload, schedule, or publish."
          }
          (out / "job_metadata.json").write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          if os.environ["CREATE_REGISTER"].lower() == "true":
              # Split on sentence-ending punctuation, retaining each extracted sentence as a review item.
              sentences = [s.strip() for s in re.split(r"(?<=[.!?])\\s+", script) if s.strip()]
              claims = []
              for i, sentence in enumerate(sentences, 1):
                  claims.append({
                      "claim_id": f"C{i:03d}",
                      "claim_text": sentence,
                      "status": "UNREVIEWED",
                      "source_urls": [],
                      "reviewer_note": "Review whether this is a factual claim. Add primary/reputable sources and have a human review the evidence before marking VERIFIED."
                  })
              register = {
                  "schema_version": "2.2",
                  "job_id": job_id,
                  "topic": topic,
                  "script_path": "script.txt",
                  "created_at_utc": datetime.now(timezone.utc).isoformat(),
                  "reviewed_by": "",
                  "claims": claims,
                  "instructions": [
                      "This is a review checklist, not an automated fact-check.",
                      "Read each source directly and confirm it supports the exact claim.",
                      "Use VERIFIED only after a human checks the evidence.",
                      "Do not mark rhetorical questions or opinions as verified scientific facts.",
                      "This workflow does not create human approval and does not publish."
                  ]
              }
              (out / "claims_review_register.json").write_text(json.dumps(register, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          readme = f"""# Draft YouTube Shorts package

- Topic: {topic}
- Job ID: {job_id}
- Voice preference: {voice}
- Status: DRAFT ONLY
- Upload/publish: DISABLED

## Files
- `script.txt`: submitted script
- `job_metadata.json`: job metadata and safety gates
- `claims_review_register.json`: human evidence checklist (if enabled)

## Required next steps
1. Review the script and rights of every media asset.
2. Open `claims_review_register.json`; add source URLs and human review notes.
3. Do not mark claims VERIFIED until a human has checked the sources.
4. This artifact is not a rendered video. No video rendering or publishing was performed.
"""
          (out / "README.md").write_text(readme, encoding="utf-8")
          print(f"Created draft review package: {out}")
          print("No video rendering, upload, scheduling, or publishing performed.")
          PY

      - name: Upload review package artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-review-package-${{ github.run_number }}
          path: web-output/
          if-no-files-found: error
          retention-days: 30
